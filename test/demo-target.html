<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Watcher Test Lab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 12px;
    }
    .status-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #334155;
    }
    .stock-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }
    .out-of-stock { background: #ef4444; color: white; }
    .in-stock { background: #10b981; color: white; }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>DOM Watcher Test Lab</h1>
  <p>Use this page to simulate real-world DOM mutations and verify the extension.</p>

  <div class="status-card">
    <h2>Limited Edition Item</h2>
    <div id="product-status">
      <span class="stock-badge out-of-stock" id="stockStatus">Out of Stock</span>
    </div>
    <button id="toggleBtn" onclick="toggleStock()">Simulate Stock Drop (Mutate DOM)</button>
  </div>

  <script>
    function toggleStock() {
      const el = document.getElementById('stockStatus');
      const isOut = el.classList.contains('out-of-stock');
      if (isOut) {
        el.className = 'stock-badge in-stock';
        el.textContent = 'In Stock (Ready to Purchase!)';
        localStorage.setItem('demo_stock', 'in_stock');
        return;
      }
      el.className = 'stock-badge out-of-stock';
      el.textContent = 'Out of Stock';
      localStorage.setItem('demo_stock', 'out_stock');
    }

    if (localStorage.getItem('demo_stock') === 'in_stock') {
      const el = document.getElementById('stockStatus');
      el.className = 'stock-badge in-stock';
      el.textContent = 'In Stock (Ready to Purchase!)';
    }
  </script>
</body>
</html>
